<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Calificaciones</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Gestión de Alumnos</h1>
        </header>
        
        <main>
            <div class="form-container card">
                <h2>Registrar / Actualizar Alumno</h2>
                <form id="student-form">
                    <input type="hidden" id="student-id">
                    <div class="form-group">
                        <label for="name">Nombre del Alumno:</label>
                        <input type="text" id="name" placeholder="Ej: Ana Gómez" required>
                    </div>
                    <div class="form-group">
                        <label for="grade">Calificación:</label>
                        <input type="number" id="grade" placeholder="Ej: 95" min="0" max="100" required>
                    </div>
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <button type="button" class="btn btn-secondary" id="cancel-button" style="display:none;">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="list-container card">
                <h2>Lista de Alumnos</h2>
                <table id="students-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Calificación</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="students-tbody">
                        </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
